---
# tasks file for sssd_config
# Install necessary packages
- name: Install required sssd packages
  apt:
    name:
      - sssd-ad
      - sssd-tools
      - realmd
      - adcli
    state: present
    update_cache: yes

- name: Join to the domain
  shell: echo "{{ join_password }}" | realm join -U joe.bloggs --computer-ou "OU=DevOps,OU=Servers,OU=LHR1,OU=UK,DC=example,DC=net" example.net

- name: Copy sssd.conf
  copy:
    src:
      sssd.conf
    dest:
      /etc/sssd/sssd.conf

- name: Enable automatic home dir creation
  shell: pam-auth-update --enable mkhomedir --force

- name: Restart sssd service
  service:
    name: sssd
    state: restarted

